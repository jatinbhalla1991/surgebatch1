input {
  beats {
    port => 5044
  }
}

filter {
  # the sample "web" service is nginx; parse its access log into structured fields
  if [container][name] =~ "web" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      remove_field => ["timestamp"]
    }
  }
}

output {
  # Heartbeat's uptime-check documents (heartbeat/heartbeat.yml) go to their
  # own index, separate from log documents. "[@metadata][beat]" is set
  # automatically by the Logstash beats input based on which Beat shipped
  # the event - no custom field needed on the Heartbeat side.
  if [@metadata][beat] == "heartbeat" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "heartbeat-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "docker-logs-%{+YYYY.MM.dd}"
    }
  }
}
