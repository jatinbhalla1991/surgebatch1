---
apiVersion: v1
kind: Namespace
metadata:
  name: sample

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: sample
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      labels:
        app: sample
    spec:
      containers:
      - name: sample
        image: jatinbhalla1991/sample:latest
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: sample
  namespace: sample
spec:
  type: LoadBalancer
  selector:
    app: sample
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
