version: '3'
services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    image: jatinbhalla1991/web
    ports:
      - "80:80"
  backend :
   image: redis
   ports:
     - "6379:6379"
  
  
  database:
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
  
  volume:
    image: busybox
    volumes:
      - ./data:/data

  
