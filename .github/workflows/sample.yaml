name: Sample Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    WORKDIR: javadocker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
    
      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ env.WORKDIR }}/pom.xml
     
      - name: Set unique release version
        working-directory: ${{ env.WORKDIR }}
        run: mvn -B versions:set -DnewVersion=1.0.0-${{ github.run_number }} -DgenerateBackupPoms=false
      
      - name: Build with Maven
        working-directory: ${{ env.WORKDIR }}
        run: mvn -B clean install

      - name: publish the jar package to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-package
          path: ${{ env.WORKDIR }}/target/*.jar