name: Sample Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    WORKDIR: javadocker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
    
      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ env.WORKDIR }}/pom.xml

      - name: Configure Maven settings.xml for Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <!-- id must match <distributionManagement> repository/snapshotRepository id in pom.xml -->
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
            <mirrors>
              <!-- Overrides Maven's bundled default mirror (same id) that blocks plain-HTTP
                   repositories since Maven 3.8.1, so deploys to the HTTP Nexus above work. -->
              <mirror>
                <id>maven-default-http-blocker</id>
                <mirrorOf>external:http:*</mirrorOf>
                <name>Allow internal HTTP Nexus</name>
                <url>http://0.0.0.0/blocked-by-mirror</url>
                <blocked>false</blocked>
              </mirror>
            </mirrors>
          </settings>
          EOF
     
      - name: Set unique release version
        working-directory: ${{ env.WORKDIR }}
        run: mvn -B versions:set -DnewVersion=1.0.0-${{ github.run_number }} -DgenerateBackupPoms=false
      
      - name: Build with Maven
        working-directory: ${{ env.WORKDIR }}
        run: mvn -B clean install

      - name: publish the jar package to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-package
          path: ${{ env.WORKDIR }}/target/*.jar
      
      - name: Publish JAR to Nexus
        working-directory: ${{ env.WORKDIR }}
        run: mvn -B deploy -DskipTests

    